# Pritunl Fleet — test lab.
# Control plane + Postgres + TWO mock Pritunl OSS nodes (HCMC, SG) so the
# multi-site path is testable end to end. Node secrets come from .env
# (copy .env.example -> .env). Nothing secret is committed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: fleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      FLEET_ENVIRONMENT: dev
      FLEET_LOG_LEVEL: INFO
      FLEET_DATABASE_URL: postgresql+psycopg://fleet:${POSTGRES_PASSWORD:-fleet}@postgres:5432/fleet
      FLEET_MASTER_KEY: ${FLEET_MASTER_KEY:-}
      FLEET_JWT_SECRET: ${FLEET_JWT_SECRET:-}
      # First-run admin (created only if no principals exist). Must enrol MFA
      # on first login before any full session is granted.
      FLEET_BOOTSTRAP_ADMIN_USER: ${FLEET_BOOTSTRAP_ADMIN_USER:-admin}
      FLEET_BOOTSTRAP_ADMIN_PASSWORD: ${FLEET_BOOTSTRAP_ADMIN_PASSWORD:-changeme-admin-pw}
      # Optional: enable emailing client profiles (Resend). Unset = email disabled.
      FLEET_RESEND_API_KEY: ${FLEET_RESEND_API_KEY:-}
      # Mock nodes speak plain HTTP inside the lab network; real deployments
      # keep this true and terminate TLS on the shim.
      FLEET_VERIFY_NODE_TLS: "false"
    ports:
      - "8200:8080"
    depends_on:
      postgres:
        condition: service_healthy

  node-hcmc:
    build:
      context: ./pritunl-shim
      dockerfile: mock/Dockerfile
    environment:
      MOCK_NODE_NAME: hcmc
      MOCK_TOKEN: ${HCMC_TOKEN:-hcmc-token}
      MOCK_SECRET: ${HCMC_SECRET:-hcmc-secret}
    # Not published to the host — reachable only on the lab network as
    # http://node-hcmc:9700 (mirrors nodes being private in the real world).

  node-sg:
    build:
      context: ./pritunl-shim
      dockerfile: mock/Dockerfile
    environment:
      MOCK_NODE_NAME: sg
      MOCK_TOKEN: ${SG_TOKEN:-sg-token}
      MOCK_SECRET: ${SG_SECRET:-sg-secret}

volumes:
  pgdata:
