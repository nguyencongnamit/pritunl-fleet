[project]
name = "pritunl-fleet-control-plane"
version = "1.1.0"
description = "Multi-site management control plane for Pritunl OSS (OpenVPN/WireGuard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "httpx>=0.27",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
# Optional per-adapter extras — installed only where that adapter is used.
mongo = ["pymongo>=4.7"]
ssh = ["asyncssh>=2.14"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]  # autogenerated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI idiom: Depends()/Query() in argument defaults
    "UP042",  # str+Enum is intentional (JSON-serializable values); not StrEnum
    "B905",   # zip() strict= not required here (equal-length by construction)
    "E501",   # long lines tolerated (docstrings/signatures)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
