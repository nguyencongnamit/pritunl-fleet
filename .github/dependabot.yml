version: 2
updates:
  - package-ecosystem: pip
    directory: /control-plane
    schedule: { interval: weekly }
    groups: { python-deps: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    # Majors (e.g. Tailwind/Vite) need manual migration — handle them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups: { npm-deps: { patterns: ["*"] } }

  # Keeps SHA-pinned actions current (Dependabot updates the pin + comment).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
